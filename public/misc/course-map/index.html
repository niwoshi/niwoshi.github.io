<!DOCTYPE html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>三田母子トレイルレース コースマップ</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --ink:#17241d;
    --paper:#f4f2ea;
    --rule:#d3d0c2;
    --muted:#6d7a71;
    --expert:#d2352b;
    --challenge:#1f5fa8;
    --kids:#2f8f4e;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{display:grid; grid-template-columns:1.1fr 1fr; height:100%; min-height:min(660px,100vh)}
  @media(max-width:800px){
    .app{grid-template-columns:1fr; grid-template-rows:minmax(320px,45vh) auto; height:auto}
  }

  /* ---- 左：地図 ---- */
  #map{height:100%; min-height:320px; background:#e8e6dc; z-index:0}
  .leaflet-container{height:100%; width:100%}
  .leaflet-container svg{width:auto; height:auto}
  .leaflet-overlay-pane svg{position:absolute}

  /* ---- 右：3コースの標高プロファイル ---- */
  .profiles{
    border-left:1px solid var(--rule); background:#fff;
    display:flex; flex-direction:column; overflow:auto;
  }
  @media(max-width:800px){ .profiles{border-left:0; border-top:1px solid var(--rule)} }

  /* ---- タブ（狭い画面でのみ表示）---- */
  .tabs{display:none}
  .profiles.single .tabs{
    display:flex; position:sticky; top:0; z-index:2;
    background:#fff; border-bottom:1px solid var(--rule);
  }
  .tab{
    flex:1; appearance:none; border:0; background:none; cursor:pointer;
    padding:10px 6px 8px; font:inherit; color:var(--muted);
    border-bottom:3px solid transparent; transition:color .15s, border-color .15s;
  }
  .tab .t-nm{display:block; font-size:12.5px; font-weight:700; letter-spacing:.02em}
  .tab .t-mt{display:block; font-size:10px; margin-top:2px; font-variant-numeric:tabular-nums}
  .tab[aria-selected="true"]{color:var(--ink)}
  .tab:focus-visible{outline:2px solid var(--ink); outline-offset:-3px}

  /* 1コース表示モード：選択中以外を隠す */
  .profiles.single .course{display:none}
  .profiles.single .course.sel{display:block; border-bottom:0}

  .course{padding:12px 16px 10px; border-bottom:1px solid var(--rule)}
  .course:last-of-type{border-bottom:0}
  .head{display:flex; align-items:baseline; gap:9px; margin-bottom:2px}
  .swatch{width:16px; height:3px; border-radius:2px; flex:none; align-self:center}
  .nm{font-size:13px; font-weight:700; letter-spacing:.02em}
  .mt{font-size:10.5px; color:var(--muted); font-variant-numeric:tabular-nums}
  .live{
    margin-left:auto; font-size:11px; font-variant-numeric:tabular-nums;
    opacity:0; transition:opacity .12s; font-weight:700; white-space:nowrap;
  }
  .course.on .live{opacity:1}

  .chart{width:100%; height:auto; display:block; touch-action:none; cursor:crosshair}
  .chart .grid{stroke:var(--rule); stroke-width:.5}
  .chart .axis{font-size:9px; fill:var(--muted); font-variant-numeric:tabular-nums}

  .foot{padding:10px 16px 12px; font-size:9.5px; line-height:1.7; color:var(--muted); border-top:1px solid var(--rule)}
  .foot a{color:inherit}
  .hint{padding:9px 16px; font-size:11px; color:var(--muted); border-bottom:1px solid var(--rule); background:#fbfaf5}
</style>

<div class="app">
  <div id="map"></div>

    </div>
  </div>
</div>

// ===== コース定義（表示名・公式表記はここを編集）====================
const ORDER = ['expert','challenge','kids'];
const COURSES = {
  expert:    { label:'エキスパート',   official:'30km / 累積2000m', color:'#d2352b' },
  challenge: { label:'チャレンジ',     official:'20km / 累積1000m', color:'#1f5fa8' },
  kids:      { label:'キッズ・ペア',   official:'5.5km / 累積300m', color:'#2f8f4e' }
};

// ===== 距離を積算 ====================================================
function hav(a,b){
  const R=6371000, r=Math.PI/180;
  const p1=a[0]*r, p2=b[0]*r, dp=p2-p1, dl=(b[1]-a[1])*r;
  const h=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
for(const k of ORDER){
  const raw=RAW[k], pts=[]; let d=0;
  for(let i=0;i<raw.length;i++){
    if(i) d+=hav(raw[i-1],raw[i]);
    pts.push({lat:raw[i][0], lon:raw[i][1], ele:raw[i][2], dist:d});
  }
  const c=COURSES[k];
  c.pts=pts; c.total=d/1000;
  c.min=Math.min(...pts.map(p=>p.ele));
  c.max=Math.max(...pts.map(p=>p.ele));
}

// ===== 3つの標高グラフを生成 =========================================
const W=600, H=132, M={t:10,r:10,b:22,l:40};
const stack=document.getElementById('stack');

for(const k of ORDER){
  const c=COURSES[k];
  const lo=Math.floor(c.min/50)*50, hi=Math.ceil(c.max/50)*50;
  c.X = km => M.l + (km/c.total)*(W-M.l-M.r);
  c.Y = e  => H-M.b - ((e-lo)/(hi-lo))*(H-M.t-M.b);

  let d='';
  c.pts.forEach((p,i)=>{ d += (i?'L':'M') + c.X(p.dist/1000).toFixed(1) + ' ' + c.Y(p.ele).toFixed(1); });
  const area = d + `L${c.X(c.total).toFixed(1)} ${H-M.b}L${c.X(0).toFixed(1)} ${H-M.b}Z`;

  let g='';
  const step=(hi-lo)/4;
  for(let e=lo;e<=hi+1;e+=step){
    const y=c.Y(e);
    g+=`<line class="grid" x1="${M.l}" x2="${W-M.r}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"/>`;
    g+=`<text class="axis" x="${M.l-6}" y="${(y+3).toFixed(1)}" text-anchor="end">${Math.round(e)}</text>`;
  }
  for(let i=0;i<=5;i++){
    const km=c.total*i/5;
    g+=`<text class="axis" x="${c.X(km).toFixed(1)}" y="${H-M.b+14}" text-anchor="middle">${km.toFixed(1)}</text>`;
  }

  const el=document.createElement('div');
  el.className='course';
  el.dataset.c=k;
  el.innerHTML =
    `<div class="head">
       <span class="swatch" style="background:${c.color}"></span>
       <span class="nm">${c.label}</span>
       <span class="mt">${c.official}</span>
       <span class="live" style="color:${c.color}" id="live-${k}"></span>
     </div>
     <svg class="chart" id="chart-${k}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet"
          aria-label="${c.label}の標高プロファイル">
       ${g}
       <path d="${area}" fill="${c.color}" fill-opacity=".15"/>
       <path d="${d}" fill="none" stroke="${c.color}" stroke-width="1.5" stroke-linejoin="round"/>
       <line class="vline" x1="0" x2="0" y1="${M.t}" y2="${H-M.b}" stroke="${c.color}" stroke-width="1" style="display:none"/>
       <circle class="cdot" r="4.5" fill="${c.color}" stroke="#fff" stroke-width="2" style="display:none"/>
       <text class="axis" x="${W-M.r}" y="${H-3}" text-anchor="end">km</text>
       <text class="axis" x="${M.l-6}" y="${M.t+2}" text-anchor="end">m</text>
     </svg>`;
  stack.appendChild(el);
}

// ===== 標高グラフ → 地図 の連動 ======================================
function idxByKm(k, km){
  const pts=COURSES[k].pts;
  let lo=0, hi=pts.length-1;
  while(lo<hi){ const m=(lo+hi)>>1; if(pts[m].dist/1000<km) lo=m+1; else hi=m; }
  return lo;
}

function clearAll(){
  cursor.setOpacity(0);
  document.querySelectorAll('.course').forEach(el=>el.classList.remove('on'));
  document.querySelectorAll('.vline,.cdot').forEach(n=>n.style.display='none');
  for(const k of ORDER) lines[k].setStyle({opacity:.9, weight:3.5});
}

function point(k, evt){
  const c=COURSES[k], svg=document.getElementById('chart-'+k);
  const r=svg.getBoundingClientRect();
  const x=(evt.clientX-r.left)/r.width*W;
  const km=Math.max(0, Math.min(c.total, (x-M.l)/(W-M.l-M.r)*c.total));
  const p=c.pts[idxByKm(k, km)];

  // 地図側
  const dot=document.getElementById('curdot');
  if(dot) dot.style.background=c.color;
  cursor.setLatLng([p.lat,p.lon]).setOpacity(1);
  for(const o of ORDER) lines[o].setStyle(o===k ? {opacity:1, weight:4.5} : {opacity:.3, weight:2.5});
  lines[k].bringToFront();

  // グラフ側
  document.querySelectorAll('.course').forEach(el=>el.classList.toggle('on', el.dataset.c===k));
  document.querySelectorAll('.vline,.cdot').forEach(n=>n.style.display='none');
  const v=svg.querySelector('.vline'), cd=svg.querySelector('.cdot');
  const px=c.X(p.dist/1000), py=c.Y(p.ele);
  v.setAttribute('x1',px); v.setAttribute('x2',px); v.style.display='';
  cd.setAttribute('cx',px); cd.setAttribute('cy',py); cd.style.display='';

  document.getElementById('live-'+k).textContent =
    `${(p.dist/1000).toFixed(2)} km ／ ${Math.round(p.ele)} m`;
}

for(const k of ORDER){
  const svg=document.getElementById('chart-'+k);
  svg.addEventListener('pointermove', e=>point(k,e));
  svg.addEventListener('pointerdown', e=>{ svg.setPointerCapture(e.pointerId); point(k,e); });
  svg.addEventListener('pointerup',   e=>{ try{svg.releasePointerCapture(e.pointerId);}catch(_){} });
  svg.addEventListener('pointerleave', clearAll);
}

const BREAKPOINT = 800;                     // ← CSS側の 800px と必ず揃える
const mq = window.matchMedia(`(max-width:${BREAKPOINT}px)`);
const profiles = document.getElementById('profiles');
const tabs = document.getElementById('tabs');

for(const k of ORDER){
  const c=COURSES[k];
  const b=document.createElement('button');
  b.className='tab'; b.type='button'; b.role='tab'; b.dataset.c=k;
  b.style.setProperty('--c', c.color);
  b.innerHTML=`<span class="t-nm">${c.label}</span><span class="t-mt">${c.official}</span>`;
  b.addEventListener('click', ()=>{ selected=k; applyMode(); });
  tabs.appendChild(b);
}

function applyMode(){
  const single = mq.matches;
  profiles.classList.toggle('single', single);

  document.querySelectorAll('.tab').forEach(t=>{
    const on = single && t.dataset.c===selected;
    t.setAttribute('aria-selected', on);
    t.style.borderBottomColor = on ? COURSES[t.dataset.c].color : 'transparent';
  });
  document.querySelectorAll('.course').forEach(el=>{
    el.classList.toggle('sel', el.dataset.c===selected);
  });

  document.getElementById('hint').textContent = single
    ? 'コースを選び、標高グラフをなぞると地図に地点が表示されます'
    : '標高グラフをなぞると、左の地図にその地点が表示されます';

  // 1コース表示のときは、その1本だけを地図に残す
  for(const k of ORDER){
    if(single && k!==selected) map.removeLayer(lines[k]);
    else if(!map.hasLayer(lines[k])) lines[k].addTo(map);
  }
  clearAll();
  fit();
}

mq.addEventListener('change', applyMode);

// ===== サイズ確定後に地図をフィット ==================================
function fit(){
  const el=document.getElementById('map');
  if(!el.clientWidth || !el.clientHeight) return;
  map.invalidateSize({animate:false});
  const shown = mq.matches ? [lines[selected]] : ORDER.map(k=>lines[k]);
  map.fitBounds(L.featureGroup(shown).getBounds(), {padding:[24,24]});
}
new ResizeObserver(fit).observe(document.getElementById('map'));
window.addEventListener('load', fit);
window.addEventListener('resize', fit);
applyMode();
requestAnimationFrame(fit);
setTimeout(fit, 300);
</script>
</html>
