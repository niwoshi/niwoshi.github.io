<!DOCTYPE html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>三田母子トレイルレース コースマップ</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --ink:#17241d;
    --paper:#f4f2ea;
    --rule:#d3d0c2;
    --muted:#6d7a71;
    --expert:#d2352b;
    --challenge:#1f5fa8;
    --kids:#2f8f4e;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{display:grid; grid-template-columns:1.1fr 1fr; height:100%; min-height:min(660px,100vh)}
  @media(max-width:800px){
    .app{grid-template-columns:1fr; grid-template-rows:minmax(320px,45vh) auto; height:auto}
  }

  /* ---- 左：地図 ---- */
  #map{height:100%; min-height:320px; background:#e8e6dc; z-index:0}
  .leaflet-container{height:100%; width:100%}
  .leaflet-container svg{width:auto; height:auto}
  .leaflet-overlay-pane svg{position:absolute}

  /* ---- 右：3コースの標高プロファイル ---- */
  .profiles{
    border-left:1px solid var(--rule); background:#fff;
    display:flex; flex-direction:column; overflow:auto;
  }
  @media(max-width:800px){ .profiles{border-left:0; border-top:1px solid var(--rule)} }

  /* ---- タブ（狭い画面でのみ表示）---- */
  .tabs{display:none}
  .profiles.single .tabs{
    display:flex; position:sticky; top:0; z-index:2;
    background:#fff; border-bottom:1px solid var(--rule);
  }
  .tab{
    flex:1; appearance:none; border:0; background:none; cursor:pointer;
    padding:10px 6px 8px; font:inherit; color:var(--muted);
    border-bottom:3px solid transparent; transition:color .15s, border-color .15s;
  }
  .tab .t-nm{display:block; font-size:12.5px; font-weight:700; letter-spacing:.02em}
  .tab .t-mt{display:block; font-size:10px; margin-top:2px; font-variant-numeric:tabular-nums}
  .tab[aria-selected="true"]{color:var(--ink)}
  .tab:focus-visible{outline:2px solid var(--ink); outline-offset:-3px}

  /* 1コース表示モード：選択中以外を隠す */
  .profiles.single .course{display:none}
  .profiles.single .course.sel{display:block; border-bottom:0}

  .course{padding:12px 16px 10px; border-bottom:1px solid var(--rule)}
  .course:last-of-type{border-bottom:0}
  .head{display:flex; align-items:baseline; gap:9px; margin-bottom:2px}
  .swatch{width:16px; height:3px; border-radius:2px; flex:none; align-self:center}
  .nm{font-size:13px; font-weight:700; letter-spacing:.02em}
  /* コース見出しの距離・累積標高は非表示。
     再表示したいときは、この2行の display:none を消す */
  .mt{display:none}
  .sub2{display:none}
  .mt-hidden-src{font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums}
  .live{
    margin-left:auto; font-size:11px; font-variant-numeric:tabular-nums;
    opacity:0; transition:opacity .12s; font-weight:700; white-space:nowrap;
  }
  .course.on .live{opacity:1}

  .chart{width:100%; height:auto; display:block; touch-action:none; cursor:crosshair}
  .chart .grid{stroke:var(--rule); stroke-width:.5}
  .chart .axis{font-size:9px; fill:var(--muted); font-variant-numeric:tabular-nums}
  .chart .unit{font-size:8.5px; letter-spacing:.08em; fill:var(--muted); opacity:.85}

  .poi{
    min-width:24px; height:20px; padding:0 5px; border-radius:10px; color:#fff;
    font-size:10.5px; font-weight:700; line-height:20px; text-align:center;
    border:2px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.4);
    font-family:inherit; letter-spacing:.03em; white-space:nowrap;
  }
  .pop .code{
    display:inline-block; margin-right:5px; padding:1px 6px; border-radius:9px;
    color:#fff; font-size:10px; font-weight:700; vertical-align:1px;
  }
  .pop{font-size:12px; min-width:190px}
  .pop b{font-size:13px}
  .pop .ty{
    display:inline-block; margin-left:6px; padding:1px 6px; border-radius:9px;
    color:#fff; font-size:9.5px; font-weight:700; vertical-align:1px;
  }
  .pop .note{margin-top:3px; color:var(--muted); font-size:11px}
  .pop table{margin-top:6px; border-collapse:collapse; width:100%; font-size:11px}
  .pop td{padding:2px 0; border-top:1px solid var(--rule); font-variant-numeric:tabular-nums}
  .leaflet-popup-content{margin:10px 12px}

  /* ---- 印刷ボタン ---- */
  .actions{padding:10px 16px; border-top:1px solid var(--rule)}
  .profiles.single .actions{display:none}      /* 狭い画面では出さない */
  #btn-preview{
    appearance:none; font:inherit; font-size:12px; font-weight:700; cursor:pointer;
    padding:8px 16px; border-radius:6px; border:1px solid var(--ink);
    background:#fff; color:var(--ink); transition:background .15s, color .15s;
  }
  #btn-preview:hover{background:var(--ink); color:#fff}
  #btn-preview:disabled{opacity:.5; cursor:progress}

  /* ---- 印刷専用要素は画面では隠す ---- */
  .printhead, .aidtable{display:none}

  /* ---- 埋め込みモード（URLに ?embed=1 を付けたとき）---- */
  body.embed .profiles{display:none}
  body.embed .app{grid-template-columns:1fr; grid-template-rows:1fr; height:100vh; min-height:0}
  body.embed #map{height:100vh; min-height:0}
  .mlegend{display:none}
  body.embed .mlegend{
    display:flex; flex-direction:column; gap:5px;
    position:absolute; top:10px; right:10px; z-index:500;
    background:rgba(255,255,255,.93); border:1px solid var(--rule);
    border-radius:8px; padding:8px 10px; box-shadow:0 2px 10px rgba(0,0,0,.15);
    font-size:12px;
  }
  .mlegend label{display:flex; align-items:center; gap:6px; cursor:pointer; white-space:nowrap}
  .mlegend .sw{display:inline-block; width:15px; height:3px; border-radius:2px; flex:none}
  .mlegend input{margin:0}

  /* ---- 印刷プレビュー ---- */
  .pvbar{display:none}
  body.preview{overflow:hidden}
  body.preview .pvbar{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    position:fixed; top:0; left:0; right:0; height:48px; z-index:60;
    padding:0 16px; background:#fff; border-bottom:1px solid var(--rule);
    box-shadow:0 2px 10px rgba(0,0,0,.08); font-size:12px;
  }
  .pvtitle{font-weight:700; letter-spacing:.03em}
  .pvcourses{display:flex; gap:12px}
  .pvchk{display:inline-flex; align-items:center; gap:4px; cursor:pointer; white-space:nowrap}
  .pvchk .sw{display:inline-block; width:13px; height:3px; border-radius:2px}
  .pvspace{flex:1}
  .pvbar select{
    font:inherit; font-size:11.5px; padding:4px 6px; border-radius:5px;
    border:1px solid var(--rule); background:#fff; color:var(--ink); cursor:pointer;
  }
  .pvbar button{
    appearance:none; font:inherit; font-size:12px; font-weight:700; cursor:pointer;
    padding:7px 15px; border-radius:6px; border:1px solid var(--ink);
    background:#fff; color:var(--ink);
  }
  .pvbar button.pri{background:var(--ink); color:#fff}
  .pvbar button:disabled{opacity:.5; cursor:progress}

  /* プレビュー中の枠は、出力レイアウトと同じ縦横比にする */
  body.preview .app{
    position:fixed; top:64px; left:0; right:0; margin:0 auto; z-index:50;
    width:min(94vw, calc((100vh - 84px) * 1.5833));
    aspect-ratio:285 / 180; height:auto; min-height:0;
    display:grid; grid-template-columns:1fr; background:#fff; overflow:hidden;
    border:1px solid var(--rule); box-shadow:0 4px 24px rgba(0,0,0,.18);
  }
  body.preview .profiles{display:none}
  body.preview #map{position:static; width:auto; height:100%; min-height:0; border:0; box-shadow:none}

  /* A3横を選んだとき */
  body.preview.a3 .app{
    width:min(94vw, calc((100vh - 84px) * 1.4316));
    aspect-ratio:408 / 285;
  }

  /* 地図＋標高グラフのレイアウトを選んだとき */
  body.preview.full .app{
    width:min(94vw, calc((100vh - 84px) * 1.7778));
    aspect-ratio:16 / 9; grid-template-columns:56% 44%;
  }
  body.preview.full .profiles{display:flex; overflow:hidden; border-left:1px solid var(--rule)}
  body.preview.full .tabs,
  body.preview.full .hint,
  body.preview.full .actions,
  body.preview.full .aidtable,
  body.preview.full .foot,
  body.preview.full .live{display:none}
  body.preview.full #stack{display:flex; flex-direction:column; height:100%; width:100%}
  body.preview.full .course{flex:1; display:flex; flex-direction:column; justify-content:center;
                            padding:6px 12px; border-bottom:1px solid #eceadf}
  body.preview.full .course:last-child{border-bottom:0}
  body.preview.full .chart{max-height:100%}

  .poi-lg{
    min-width:56px; height:40px; padding:0 11px; border-radius:20px;
    font-size:22px; line-height:40px; border-width:4px;
    letter-spacing:.02em; box-shadow:0 2px 7px rgba(0,0,0,.45);
  }

  /* 印刷直前に画面上でも印刷サイズを再現し、そのサイズでタイルを読ませる */

  /* ================= 印刷 (A4横・地図のみ) ================= */
  @media print{
    @page{ size:A4 landscape; margin:6mm }
    html,body{height:auto; background:#fff; overflow:hidden}
    *{-webkit-print-color-adjust:exact; print-color-adjust:exact}

    /* 地図以外はすべて出さない */
    .printhead,.tabs,.hint,.actions,#stack,.aidtable,.foot,.profiles,.pvbar,
    .leaflet-control-zoom,.leaflet-popup,.live,.leaflet-tooltip{display:none !important}

    .app{
      display:block; height:auto; min-height:0; width:auto;
      position:static !important; aspect-ratio:auto !important;
      border:0 !important; box-shadow:none !important;
      overflow:hidden; page-break-after:avoid; break-after:avoid;
    }
    #map{
      position:static !important; width:100% !important; height:180mm !important;
      max-height:180mm !important; min-height:0 !important;
      aspect-ratio:auto !important; margin:0 !important;
      border:0; box-shadow:none;
      page-break-inside:avoid; break-inside:avoid;
      page-break-after:avoid; break-after:avoid;
    }
    /* 出典表示は地理院タイルの利用条件のため残す */
    .leaflet-control-attribution{
      font-size:6pt; background:rgba(255,255,255,.85); box-shadow:none;
    }
  }

  .plegend{display:none}

  .foot{padding:10px 16px 12px; font-size:9.5px; line-height:1.7; color:var(--muted); border-top:1px solid var(--rule)}
  .foot a{color:inherit}
  .hint{padding:9px 16px; font-size:11px; color:var(--muted); border-bottom:1px solid var(--rule); background:#fbfaf5}
</style>

<div class="printhead">
  <b>三田母子トレイルレース コースマップ</b>
  <span class="plegend" id="plegend"></span>
  <span id="printdate"></span>
</div>

<div class="pvbar" id="pvbar">
  <span class="pvtitle">印刷プレビュー — A4横 <small style="font-weight:400;opacity:.6">v19</small></span>
  <span class="pvcourses" id="pvcourses"></span>
  <label class="pvchk"><input type="checkbox" id="pv-badge" checked> 地点バッジ</label>
  <span class="pvspace"></span>
  <label class="pvchk">レイアウト
    <select id="png-layout">
      <option value="map-a4" selected>地図のみ・A4横</option>
      <option value="map-a3">地図のみ・A3横</option>
      <option value="full">地図＋標高グラフ・16:9</option>
    </select>
  </label>
  <label class="pvchk">解像度
    <select id="png-size">
      <option value="4800">最高（4800px・A3印刷 約300dpi）</option>
      <option value="3300" selected>高（3300px・A4印刷 約294dpi）</option>
      <option value="2000">中（2000px）</option>
      <option value="1200">低（1200px・Web掲載向け）</option>
      <option value="800">最小（800px・軽量）</option>
    </select>
  </label>
  <button type="button" id="btn-png" class="pri">PNG保存</button>
  <button type="button" id="btn-doprint">印刷</button>
  <button type="button" id="btn-close">閉じる</button>
</div>

<div class="app">
  <div id="map"></div>

  <div class="profiles" id="profiles">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="hint" id="hint">標高グラフをなぞると、左の地図にその地点が表示されます</div>
    <div id="stack"></div>
    <div class="actions" id="actions">
      <button type="button" id="btn-preview">印刷プレビュー（A4横）</button>
    </div>
    <table class="aidtable" id="aidtable"></table>
    <div class="foot">
      出典：<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">地理院タイル</a>（国土地理院）／
      コース図は主催者提供のGPXをもとに作成。距離・累積標高は地理院標高DEM（5mメッシュ）で再計算した実測値です。
      <b style="color:var(--ink)">［build v19：線幅を完全に統一］</b>
    </div>
  </div>
</div>

}

// ===== 距離を積算 ====================================================
function hav(a,b){
  const R=6371000, r=Math.PI/180;
  const p1=a[0]*r, p2=b[0]*r, dp=p2-p1, dl=(b[1]-a[1])*r;
  const h=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
for(const k of ORDER){
  const raw=RAW[k], pts=[]; let d=0;
  for(let i=0;i<raw.length;i++){
    if(i) d+=hav(raw[i-1],raw[i]);
    pts.push({lat:raw[i][0], lon:raw[i][1], ele:raw[i][2], dist:d});
  }
  const c=COURSES[k];
  c.pts=pts; c.total=d/1000;
  c.min=Math.min(...pts.map(p=>p.ele));
  c.max=Math.max(...pts.map(p=>p.ele));
}

// cutoff: コースごとの関門時刻。無ければ関門なし
// 他コースが同じ場所を通るかは自動判定（コース線から150m以内なら通過とみなす）
// 通過判定を上書きしたいときは skip:['kids'] / force:{kids:3.35} を書く
const SNAP_TOL = 150;

// ----- 距離(km) → コース線上の座標・標高 -----------------------------
function atKm(course, km){
  const pts=COURSES[course].pts, target=km*1000;
  for(let i=1;i<pts.length;i++){
    if(pts[i].dist>=target){
      const t=(target-pts[i-1].dist)/Math.max(1e-9, pts[i].dist-pts[i-1].dist);
      return { lat:pts[i-1].lat+t*(pts[i].lat-pts[i-1].lat),
               lon:pts[i-1].lon+t*(pts[i].lon-pts[i-1].lon),
               ele:pts[i-1].ele+t*(pts[i].ele-pts[i-1].ele), km };
    }
  }
  const l=pts[pts.length-1];
  return { lat:l.lat, lon:l.lon, ele:l.ele, km:l.dist/1000 };
}

// ----- 座標 → そのコース上の最近傍距離 -------------------------------
function project(course, lat, lon){
  const pts=COURSES[course].pts;
  let best=0, bd=Infinity;
  for(let i=0;i<pts.length;i++){
    const d=hav([lat,lon],[pts[i].lat,pts[i].lon]);
    if(d<bd){ bd=d; best=i; }
  }
  return { km:pts[best].dist/1000, off:bd, ele:pts[best].ele };
}

// ----- 各地点をコースごとに解決 --------------------------------------
for(const p of POIS){
  const base = Object.keys(p.at)[0];
  const anchor = atKm(base, p.at[base]);
  p.lat=anchor.lat; p.lon=anchor.lon;
  p.courses={};

  for(const k of ORDER){
    if(p.skip && p.skip.includes(k)) continue;

    let km, off=0;
    if(p.at[k] != null)            { km=p.at[k]; }
    else if(p.force && p.force[k]!=null){ km=p.force[k]; }
    else {
      const pr=project(k, p.lat, p.lon);
      if(pr.off > SNAP_TOL) continue;            // このコースは通らない
      km=pr.km; off=Math.round(pr.off);
    }
    if(p.alsoStartOf && p.alsoStartOf.includes(k)) km=0;

    const pos=atKm(k, km);
    p.courses[k]={ km, off, ele:pos.ele, lat:pos.lat, lon:pos.lon,
                   cutoff:(p.cutoff && p.cutoff[k]) || null };
  }
}

  return POIS.filter(p=>p.courses[k]).sort((a,b)=>a.courses[k].km-b.courses[k].km);

function renderPois(keys, big){
  poiLayer.clearLayers();

  const an = big ? [32,20] : [15,10];
  const seen=new Set();
  for(const k of keys) for(const p of poisOf(k)){
    if(seen.has(p.id)) continue;
    seen.add(p.id);
    const t=POI_TYPES[p.type];
    const rows = keys.filter(kk=>p.courses[kk]).map(kk=>{
      const i=p.courses[kk];
      return `<tr><td style="color:${COURSES[kk].color};font-weight:700">${COURSES[kk].label}</td>`

           + `<td style="text-align:right">${i.cutoff ? '関門 '+i.cutoff : '—'}</td></tr>`;
    }).join('');
    const badge = p.code;
    L.marker([p.lat, p.lon], {
      icon: L.divIcon({ className:'', iconSize:sz, iconAnchor:an, html:
        `<div class="poi${big?' poi-lg':''}" style="background:${t.color}">${badge}</div>` }),
      zIndexOffset: 500

     .bindTooltip(`${p.code} ${p.name}`, {direction:'top', offset:[0,-13]})
     .bindPopup(
       `<div class="pop"><span class="code" style="background:${t.color}">${p.code}</span><b>${p.name}</b><span class="ty" style="background:${t.color}">${t.label}</span>`
       + (p.note?`<div class="note">${p.note}</div>`:'')
       + `<table>${rows}</table></div>`);
  }
}

  c.Y = e  => H-M.b - ((e-lo)/(hi-lo))*(H-M.t-M.b);

  let d='';
  c.pts.forEach((p,i)=>{ d += (i?'L':'M') + c.X(p.dist/1000).toFixed(1) + ' ' + c.Y(p.ele).toFixed(1); });
  const area = d + `L${c.X(c.total).toFixed(1)} ${H-M.b}L${c.X(0).toFixed(1)} ${H-M.b}Z`;

  let g='';
  const step=(hi-lo)/4;
  for(let e=lo;e<=hi+1;e+=step){
    const y=c.Y(e);
    g+=`<line class="grid" x1="${M.l}" x2="${W-M.r}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"/>`;
    g+=`<text class="axis" x="${M.l-6}" y="${(y+3).toFixed(1)}" text-anchor="end">${Math.round(e)}</text>`;
  }
  for(let i=0;i<=5;i++){
    const km=c.total*i/5;
    g+=`<text class="axis" x="${c.X(km).toFixed(1)}" y="${H-M.b+13}" text-anchor="middle">${km.toFixed(1)}</text>`;
  }

  // 地点マーカー（標高グラフ上）
  let marks='';
  for(const p of poisOf(k)){
    const info=p.courses[k], t=POI_TYPES[p.type];
    const x=c.X(info.km);
    marks += `<line x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${M.t+9}" y2="${H-M.b}"
                    stroke="${t.color}" stroke-width=".9" stroke-dasharray="2.5 2.5" opacity=".75"/>`
           + `<rect x="${(x-8.5).toFixed(1)}" y="${M.t-2}" width="17" height="12" rx="6" fill="${t.color}"/>`
           + `<text x="${x.toFixed(1)}" y="${M.t+6.5}" text-anchor="middle"
                    font-size="8" font-weight="700" fill="#fff">${p.code}</text>`
           + `<title>${p.code} ${p.name}（${t.label}） ${info.km.toFixed(2)} km`
           + `${info.cutoff ? ' ／ 関門 '+info.cutoff : ''}</title>`;
  }

  const el=document.createElement('div');
  el.className='course';
  el.dataset.c=k;
  el.innerHTML =
    `<div class="head">
       <span class="swatch" style="background:${c.color}"></span>
       <span class="nm">${c.label}</span>
       <span class="mt">${c.official}</span>
       <span class="live" style="color:${c.color}" id="live-${k}"></span>
     </div>
     <div class="sub2">最高 ${c.stat.max} m ／ 最低 ${c.stat.min} m ／ 標高差 ${c.stat.max-c.stat.min} m</div>
     <svg class="chart" id="chart-${k}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet"
          aria-label="${c.label}の標高プロファイル">
       ${g}
       <path d="${area}" fill="${c.color}" fill-opacity=".15"/>
       <path d="${d}" fill="none" stroke="${c.color}" stroke-width="1.5" stroke-linejoin="round"/>
       ${marks}
       <line class="vline" x1="0" x2="0" y1="${M.t}" y2="${H-M.b}" stroke="${c.color}" stroke-width="1" style="display:none"/>
       <circle class="cdot" r="4.5" fill="${c.color}" stroke="#fff" stroke-width="2" style="display:none"/>
       <text class="axis unit" x="${(M.l+(W-M.r))/2}" y="${H-4}" text-anchor="middle">距離 (km)</text>
       <text class="axis unit" text-anchor="middle"
             transform="translate(11,${(M.t+(H-M.b))/2}) rotate(-90)">標高 (m)</text>
     </svg>`;
  stack.appendChild(el);
}

// ===== 標高グラフ → 地図 の連動 ======================================
function idxByKm(k, km){
  const pts=COURSES[k].pts;
  let lo=0, hi=pts.length-1;
  while(lo<hi){ const m=(lo+hi)>>1; if(pts[m].dist/1000<km) lo=m+1; else hi=m; }
  return lo;
}

function clearAll(){
  cursor.setOpacity(0);
  document.querySelectorAll('.course').forEach(el=>el.classList.remove('on'));
  document.querySelectorAll('.vline,.cdot').forEach(n=>n.style.display='none');
  for(const k of ORDER) lines[k].setStyle({opacity:.95, weight:SCREEN_W[k], dashArray:null});
}

function point(k, evt){
  const c=COURSES[k], svg=document.getElementById('chart-'+k);
  const r=svg.getBoundingClientRect();
  const x=(evt.clientX-r.left)/r.width*W;
  const km=Math.max(0, Math.min(c.total, (x-M.l)/(W-M.l-M.r)*c.total));
  const p=c.pts[idxByKm(k, km)];

  // 地図側
  const dot=document.getElementById('curdot');
  if(dot) dot.style.background=c.color;
  cursor.setLatLng([p.lat,p.lon]).setOpacity(1);
  for(const o of ORDER) lines[o].setStyle(o===k ? {opacity:1, weight:4.5} : {opacity:.3, weight:2.5});
  lines[k].bringToFront();

  // グラフ側
  document.querySelectorAll('.course').forEach(el=>el.classList.toggle('on', el.dataset.c===k));
  document.querySelectorAll('.vline,.cdot').forEach(n=>n.style.display='none');
  const v=svg.querySelector('.vline'), cd=svg.querySelector('.cdot');
  const px=c.X(p.dist/1000), py=c.Y(p.ele);
  v.setAttribute('x1',px); v.setAttribute('x2',px); v.style.display='';
  cd.setAttribute('cx',px); cd.setAttribute('cy',py); cd.style.display='';

  document.getElementById('live-'+k).textContent =
    `${(p.dist/1000).toFixed(2)} km ／ ${Math.round(p.ele)} m`;
}

for(const k of ORDER){
  const svg=document.getElementById('chart-'+k);
  svg.addEventListener('pointermove', e=>point(k,e));
  svg.addEventListener('pointerdown', e=>{ svg.setPointerCapture(e.pointerId); point(k,e); });
  svg.addEventListener('pointerup',   e=>{ try{svg.releasePointerCapture(e.pointerId);}catch(_){} });
  svg.addEventListener('pointerleave', clearAll);
}

// 用紙ごとの印刷可能幅(mm)。解像度ラベルのdpi表示に使う
const PAPER_MM = { 'map-a4':285, 'map-a3':408 };
const SIZE_OPTS = [4800, 3300, 2000, 1200, 800];

// 選んだ用紙に応じて解像度の選択肢を作り直す
function refreshSizeOptions(){
  const v   = document.getElementById('png-layout').value;
  const mm  = PAPER_MM[v];
  const sel = document.getElementById('png-size');
  const cur = parseInt(sel.value, 10);
  sel.innerHTML = '';

  let best = null;
  for(const w of SIZE_OPTS){
    let label, ok = true;
    if(mm){
      const dpi  = Math.round(w / (mm/25.4));
      const mark = dpi>=250 ? '印刷向き' : (dpi>=150 ? '実用' : '粗い');
      label = w + 'px ／ ' + dpi + 'dpi（' + mark + '）';
      ok = dpi >= 150;
      if(dpi>=250) best = w;              // 印刷に足る中で最も小さいもの
    }else{
      label = w>=3300 ? w + 'px（重い）'
            : w>=2000 ? w + 'px（Web掲載におすすめ）'
            : w + 'px（軽量）';
      if(w===2000) best = w;
    }
    const o = document.createElement('option');
    o.value = w;
    o.textContent = (ok ? '' : '△ ') + label;
    sel.appendChild(o);
  }
  // 今の選択が印刷に耐えるならそのまま、無理なら推奨値に切り替える
  sel.value = cur;
  if(mm && Math.round(cur/(mm/25.4)) < 150) sel.value = best;
  if(!sel.value) sel.value = best || 2000;
}

// ===== PNG書き出し（ブラウザの印刷機能を経由しない）==================
// タイルとコース線を自前で canvas に合成するため、印刷CSSやLeafletの
// 再描画タイミングに左右されず、常に同じ結果が得られる。
const OUT_AR = 285/180;             // 印刷面と同じ縦横比
function outWidth(){                // 出力幅(px)はツールバーの選択に従う
  return parseInt(document.getElementById('png-size').value, 10) || 1200;
}

// 緯度経度 → ズーム0基準のワールド座標(256px)
function world0(lat, lon){
  const x = (lon+180)/360*256;
  const sy = Math.max(-0.9999, Math.min(0.9999, Math.sin(lat*Math.PI/180)));
  const y = (0.5 - Math.log((1+sy)/(1-sy))/(4*Math.PI))*256;
  return {x, y};
}

function loadTile(url){
  return new Promise(res=>{
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = ()=>res(img);
    img.onerror = ()=>res(null);          // 欠測タイルは白のまま
    img.src = url;
  });
}

// 角丸矩形（canvas）
function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y); ctx.lineTo(x+w-r, y); ctx.arcTo(x+w, y, x+w, y+r, r);
  ctx.lineTo(x+w, y+h-r); ctx.arcTo(x+w, y+h, x+w-r, y+h, r);
  ctx.lineTo(x+r, y+h); ctx.arcTo(x, y+h, x, y+h-r, r);
  ctx.lineTo(x, y+r); ctx.arcTo(x, y, x+r, y, r); ctx.closePath();
}

// 標高プロファイルを canvas に描く（画面のSVG版と同じ体裁）
function drawProfile(ctx, k, ox, oy, w, h, showBadge){
  const c = COURSES[k];
  const f  = Math.max(7, h*0.060);          // 基本フォント
  const pl = ox + w*0.150, pr = ox + w*0.985;   // Y軸ラベル用に左を広く
  const pt = oy + h*0.40,  pb = oy + h*0.74;    // バッジ行と軸ラベル用の余白
  const lo = Math.floor(c.min/50)*50, hi = Math.ceil(c.max/50)*50;
  const X  = km => pl + (km/c.total)*(pr-pl);
  const Yv = e  => pb - ((e-lo)/(hi-lo))*(pb-pt);

  // 見出し（色見本＋コース名）
  ctx.fillStyle = c.color;
  roundRect(ctx, ox+w*0.005, oy+h*0.105, w*0.026, Math.max(2, h*0.022), Math.max(1, h*0.011));
  ctx.fill();
  ctx.fillStyle = '#17241d';
  ctx.font = `700 ${(f*1.15).toFixed(1)}px "Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif`;
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(c.label, ox + w*0.042, oy + h*0.115);

  // Y軸グリッド
  ctx.strokeStyle = '#d3d0c2'; ctx.lineWidth = Math.max(0.6, w/1500);
  ctx.fillStyle = '#6d7a71';
  ctx.font = `${f.toFixed(1)}px "Hiragino Kaku Gothic ProN",sans-serif`;
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for(let i=0;i<=4;i++){
    const e = lo + (hi-lo)*i/4, y = Yv(e);
    ctx.beginPath(); ctx.moveTo(pl, y); ctx.lineTo(pr, y); ctx.stroke();
    ctx.fillText(String(Math.round(e)), pl - w*0.018, y);
  }

  // 面と線
  const trace = () => {
    ctx.beginPath();
    c.pts.forEach((p,i)=>{
      const px=X(p.dist/1000), py=Yv(p.ele);
      i ? ctx.lineTo(px,py) : ctx.moveTo(px,py);
    });
  };
  trace();
  ctx.lineTo(X(c.total), pb); ctx.lineTo(pl, pb); ctx.closePath();
  ctx.globalAlpha = 0.15; ctx.fillStyle = c.color; ctx.fill(); ctx.globalAlpha = 1;
  trace();
  ctx.strokeStyle = c.color; ctx.lineWidth = Math.max(1, w/650);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke();

  // X軸ラベル
  ctx.fillStyle = '#6d7a71';
  ctx.font = `${f.toFixed(1)}px "Hiragino Kaku Gothic ProN",sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  for(let i=0;i<=5;i++){
    const km = c.total*i/5;
    ctx.fillText(km.toFixed(1), X(km), pb + h*0.035);
  }

  // 軸の単位
  ctx.font = `${(f*0.92).toFixed(1)}px "Hiragino Kaku Gothic ProN",sans-serif`;
  ctx.fillText('距離 (km)', (pl+pr)/2, pb + h*0.145);
  ctx.save();
  ctx.translate(ox + w*0.032, (pt+pb)/2); ctx.rotate(-Math.PI/2);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('標高 (m)', 0, 0);
  ctx.restore();

  // 地点バッジ
  if(showBadge){
    const bh = h*0.085;
    for(const p of poisOf(k)){
      const info = p.courses[k], t = POI_TYPES[p.type];
      const px = X(info.km);
      ctx.strokeStyle = t.color; ctx.lineWidth = Math.max(0.8, w/1300);
      ctx.setLineDash([w/200, w/280]);
      ctx.beginPath(); ctx.moveTo(px, pt - bh*0.1); ctx.lineTo(px, pb); ctx.stroke();
      ctx.setLineDash([]);
      ctx.font = `700 ${(bh*0.58).toFixed(1)}px "Hiragino Kaku Gothic ProN",sans-serif`;
      const bw = Math.max(bh*1.5, ctx.measureText(p.code).width + bh*0.7);
      roundRect(ctx, px-bw/2, pt-bh*1.35, bw, bh, bh/2);
      ctx.fillStyle = t.color; ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(p.code, px, pt - bh*1.35 + bh*0.54);
    }
  }
}

// ===== 用紙・レイアウトのプリセット ==================================
// ar   : 縦横比（印刷可能領域）
// page : 印刷時の @page 指定
const PAPERS = {
  'map-a4': { ar:285/180, page:'A4 landscape', label:'A4横' },
  'map-a3': { ar:408/285, page:'A3 landscape', label:'A3横' },
  'full'  : { ar:16/9,    page:null,           label:'16:9' }
};

// 同時ダウンロード数を制限してタイルを取得する
async function runLimited(tasks, limit, onProgress){
  let i=0, done=0;
  const worker = async ()=>{
    while(i < tasks.length){
      const idx = i++;
      await tasks[idx]();
      if(onProgress) onProgress(++done, tasks.length);
    }
  };
  await Promise.all(Array.from({length:Math.min(limit, tasks.length)}, worker));
}

// 地図画像を canvas に描いて返す（PNG保存・印刷の共通処理）
async function buildCanvas(onProgress){
  const shown = ORDER.filter(k=>pvOn[k]);
  if(!shown.length) return null;

  const layoutKey = document.getElementById('png-layout').value;
  const paper     = PAPERS[layoutKey] || PAPERS['map-a4'];
  const isFull    = layoutKey === 'full';
  const showBadge = document.getElementById('pv-badge').checked;
  const OUT_W     = outWidth();

  let W = OUT_W, H = Math.round(W/paper.ar), mapW = W, mapH = H;
  if(isFull){ mapW = Math.round(W*0.56); mapH = H; }

  // --- 描画範囲を地図領域の縦横比に合わせる ---
  let x0=Infinity, x1=-Infinity, y0=Infinity, y1=-Infinity;
  for(const k of shown) for(const p of COURSES[k].pts){
    const q = world0(p.lat, p.lon);
    x0=Math.min(x0,q.x); x1=Math.max(x1,q.x);
    y0=Math.min(y0,q.y); y1=Math.max(y1,q.y);
  }
  const padX=(x1-x0)*0.03, padY=(y1-y0)*0.03;
  x0-=padX; x1+=padX; y0-=padY; y1+=padY;

  const AR = mapW/mapH;
  let bw=x1-x0, bh=y1-y0;
  if(bw/bh < AR){ const need=bh*AR, c=(x0+x1)/2; x0=c-need/2; x1=c+need/2; }
  else          { const need=bw/AR, c=(y0+y1)/2; y0=c-need/2; y1=c+need/2; }
  bw=x1-x0;
  const scale = mapW/bw;

  // --- ズーム選択 ---
  // ceil を使い、タイルの解像度が必ず出力解像度以上になるようにする。
  // round だと拡大表示になってぼやける（範囲の広いコースほど顕著）。
  const tileCount = zz => {
    const n = 2**zz, tw = 256/n;
    return (Math.floor(x1/tw)-Math.floor(x0/tw)+1) * (Math.floor(y1/tw)-Math.floor(y0/tw)+1);
  };
  let z = Math.min(18, Math.max(1, Math.ceil(Math.log2(scale))));
  while(z>1 && tileCount(z) > 1200) z--;      // 枚数の上限

  const cv = document.createElement('canvas');
  cv.width=W; cv.height=H;
  const ctx = cv.getContext('2d');
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);

  // --- 地図タイル ---
  ctx.save();
  ctx.beginPath(); ctx.rect(0,0,mapW,mapH); ctx.clip();

  const n = 2**z, tw = 256/n;
  const tx0=Math.floor(x0/tw), tx1=Math.floor(x1/tw);
  const ty0=Math.floor(y0/tw), ty1=Math.floor(y1/tw);
  const base = swapped
    ? 'https://tile.openstreetmap.org/{z}/{x}/{y}.png'
    : 'https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png';

  const tasks=[];
  for(let tx=tx0; tx<=tx1; tx++) for(let ty=ty0; ty<=ty1; ty++){
    if(tx<0||ty<0||tx>=n||ty>=n) continue;
    const url = base.replace('{z}',z).replace('{x}',tx).replace('{y}',ty);
    tasks.push(async ()=>{
      const img = await loadTile(url);
      if(!img) return;
      const dx=(tx*tw-x0)*scale, dy=(ty*tw-y0)*scale, d=tw*scale;
      ctx.drawImage(img, dx, dy, d+1, d+1);
    });
  }
  await runLimited(tasks, 12, onProgress);

  // --- コース線 ---
  const PX = p => { const q=world0(p.lat,p.lon); return [(q.x-x0)*scale, (q.y-y0)*scale]; };
  const LW = mapW/420;
  // すべて実線。エキスパートを最も太く、ビギナーを最も細くして
  // 描画順（太い順に下）で重複区間の判別ができるようにする
  const WEIGHT = { expert:LW*1.55, challenge:LW*1.55, kids:LW*1.55 };
  ctx.lineJoin='round'; ctx.lineCap='round';
  for(const k of shown){
    ctx.strokeStyle=COURSES[k].color;
    ctx.lineWidth=WEIGHT[k] || LW;
    ctx.beginPath();
    COURSES[k].pts.forEach((p,i)=>{ const [X,Y]=PX(p); i?ctx.lineTo(X,Y):ctx.moveTo(X,Y); });
    ctx.stroke();
  }

  // --- 地図上の地点バッジ ---
  const BH = mapW/24;
  if(showBadge){
    const seen=new Set();
    ctx.textAlign='center'; ctx.textBaseline='middle';
    for(const k of shown) for(const p of poisOf(k)){
      if(seen.has(p.id)) continue;
      seen.add(p.id);
      const t=POI_TYPES[p.type];
      const [X,Y]=PX(p.courses[k]);
      ctx.font=`700 ${BH*0.56}px "Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif`;
      const bw2=Math.max(BH*1.45, ctx.measureText(p.code).width + BH*0.75);
      roundRect(ctx, X-bw2/2, Y-BH/2, bw2, BH, BH/2);
      ctx.fillStyle=t.color; ctx.fill();
      ctx.strokeStyle='#fff'; ctx.lineWidth=BH*0.13; ctx.stroke();
      ctx.fillStyle='#fff'; ctx.fillText(p.code, X, Y+BH*0.02);
    }
  }

  // --- 出典表示（地理院タイルの利用条件）---
  const credit = swapped ? '© OpenStreetMap contributors' : '出典：地理院タイル（国土地理院）';
  ctx.font=`${mapW/190}px "Hiragino Kaku Gothic ProN",sans-serif`;
  ctx.textAlign='right'; ctx.textBaseline='bottom';
  const tw2=ctx.measureText(credit).width, pad=mapW/300;
  ctx.fillStyle='rgba(255,255,255,.88)';
  ctx.fillRect(mapW-tw2-pad*3, mapH-mapW/120-pad, tw2+pad*3, mapW/120+pad);
  ctx.fillStyle='#333';
  ctx.fillText(credit, mapW-pad*1.5, mapH-pad*0.6);

  ctx.restore();

  // --- 右側の標高グラフ ---
  if(isFull){
    const px0 = mapW, pw = W-mapW;
    ctx.fillStyle='#fff'; ctx.fillRect(px0, 0, pw, H);
    ctx.strokeStyle='#d3d0c2'; ctx.lineWidth=Math.max(1, W/2000);
    ctx.beginPath(); ctx.moveTo(px0+.5, 0); ctx.lineTo(px0+.5, H); ctx.stroke();

    const inner = pw*0.055, rows = shown.length, rh = H/rows;
    shown.forEach((k, i)=>{
      drawProfile(ctx, k, px0+inner, i*rh, pw-inner*1.6, rh, showBadge);
      if(i<rows-1){
        ctx.strokeStyle='#e6e3d7'; ctx.lineWidth=Math.max(1, W/2400);
        ctx.beginPath();
        ctx.moveTo(px0+inner, (i+1)*rh); ctx.lineTo(W-inner, (i+1)*rh); ctx.stroke();
      }
    });
  }

  return { canvas:cv, paper, shown, isFull, W, z, tiles:tasks.length };
}

// ----- PNG保存 ---------------------------------------------------------
const btnPng=document.getElementById('btn-png');
btnPng.addEventListener('click', async ()=>{
  btnPng.disabled=true; btnPng.textContent='生成中…';
  try{
    const r = await buildCanvas((d,t)=>{ btnPng.textContent=`地図取得 ${d}/${t}`; });
    if(!r) return;
    btnPng.textContent='書き出し中…';
    const names = r.shown.length===ORDER.length ? '全コース'
                : r.shown.map(k=>COURSES[k].label).join('・');
    const tag = r.isFull ? '地図と標高' : '地図';
    await new Promise(res=> r.canvas.toBlob(b=>{
      const a=document.createElement('a');
      a.href=URL.createObjectURL(b);
      a.download=`三田母子トレイルレース_${names}_${tag}_${r.W}px.png`;
      a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
      res();
    }, 'image/png'));
  }catch(err){ alert('PNGの生成に失敗しました: '+err.message); }
  btnPng.disabled=false; btnPng.textContent='PNG保存';
});

// ----- 印刷（生成した画像を印刷する）-----------------------------------
// ブラウザの印刷レイアウトに Leaflet を追従させる方式はタイミング依存で
// 不安定だったため、PNGと同じ canvas を作り、それだけを印刷する。
const doPrint=document.getElementById('btn-doprint');
doPrint.addEventListener('click', async ()=>{
  doPrint.disabled=true; doPrint.textContent='準備中…';
  try{
    const r = await buildCanvas((d,t)=>{ doPrint.textContent=`地図取得 ${d}/${t}`; });
    if(!r) return;
    const url  = r.canvas.toDataURL('image/png');
    const page = r.paper.page || 'A4 landscape';
    const win  = window.open('', '_blank');
    if(!win){ alert('ポップアップがブロックされました。許可してから再度お試しください。'); return; }

    // document.write は使わない。
    // JSの文字列にHTMLの閉じタグを書くとパーサーがスクリプトの終端と
    // 誤判定することがあるため、DOM APIで組み立てる。
    const d = win.document;
    d.title = '三田母子トレイルレース コースマップ';
    const st = d.createElement('style');
    st.textContent =
      '@page{size:' + page + '; margin:6mm}'
      + 'html,body{margin:0;padding:0;background:#fff}'
      + 'img{width:100%;height:auto;display:block}';
    d.head.appendChild(st);
    const img = d.createElement('img');
    img.src = url;
    d.body.appendChild(img);

    const go = ()=>{ win.focus(); win.print(); };
    if(img.complete) setTimeout(go, 250); else img.onload = ()=> setTimeout(go, 250);
  }catch(err){ alert('印刷用画像の生成に失敗しました: '+err.message); }
  doPrint.disabled=false; doPrint.textContent='印刷';
});

// ===== 埋め込みモード判定（?embed=1 で地図のみ表示）===================
const EMBED = new URLSearchParams(location.search).has('embed');
if(EMBED) document.body.classList.add('embed');

// ===== レイアウト切替（CSSの @media と同じ値を使う）==================
const BREAKPOINT = 800;                     // ← CSS側の 800px と必ず揃える
const mq = window.matchMedia(`(max-width:${BREAKPOINT}px)`);
const profiles = document.getElementById('profiles');
const tabs = document.getElementById('tabs');
let selected = 'expert';                    // 1コース表示モードでの選択状態

// タブを生成
for(const k of ORDER){
  const c=COURSES[k];
  const b=document.createElement('button');
  b.className='tab'; b.type='button'; b.role='tab'; b.dataset.c=k;
  b.style.setProperty('--c', c.color);
  b.innerHTML=`<span class="t-nm">${c.label}</span>`;
  b.addEventListener('click', ()=>{ selected=k; applyMode(); });
  tabs.appendChild(b);
}

function applyMode(){
  const single = mq.matches && !EMBED;   // 埋め込みモードでは常に全コース表示
  profiles.classList.toggle('single', single);

  document.querySelectorAll('.tab').forEach(t=>{
    const on = single && t.dataset.c===selected;
    t.setAttribute('aria-selected', on);
    t.style.borderBottomColor = on ? COURSES[t.dataset.c].color : 'transparent';
  });
  document.querySelectorAll('.course').forEach(el=>{
    el.classList.toggle('sel', el.dataset.c===selected);
  });

  document.getElementById('hint').textContent = single
    ? 'コースを選び、標高グラフをなぞると地図に地点が表示されます'
    : '標高グラフをなぞると、左の地図にその地点が表示されます';

  // 1コース表示のときは、その1本だけを地図に残す
  for(const k of ORDER){
    if(single && k!==selected) map.removeLayer(lines[k]);
    else if(!map.hasLayer(lines[k])) lines[k].addTo(map);
  }
  // 表示中のコースに属する地点だけを地図に出す
  renderPois(single ? [selected] : ORDER);

  clearAll();
  fit();
}

mq.addEventListener('change', applyMode);

// ----- 埋め込みモード用の凡例（地図内に重ねる。チェックで表示切替）-----
if(EMBED){
  const box=document.createElement('div');
  box.className='mlegend';
  box.innerHTML = ORDER.map(k=>
    `<label><input type="checkbox" data-c="${k}" checked>`
    + `<span class="sw" style="background:${COURSES[k].color}"></span>${COURSES[k].label}</label>`
  ).join('');
  document.getElementById('map').appendChild(box);
  L.DomEvent.disableClickPropagation(box);   // 地図のドラッグに巻き込まれないように
  box.querySelectorAll('input').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const k=cb.dataset.c;
      if(cb.checked){ lines[k].addTo(map); lines[k].bringToFront(); }
      else if(map.hasLayer(lines[k])) map.removeLayer(lines[k]);
      renderPois(ORDER.filter(x=>box.querySelector(`input[data-c="${x}"]`).checked));
    });
  });
}

// ===== サイズ確定後に地図をフィット ==================================
let roPaused = false;

function fit(){
  if(previewing || roPaused) return;     // プレビュー中は自動フィットしない
  const el=document.getElementById('map');
  if(!el.clientWidth || !el.clientHeight) return;
  map.invalidateSize({animate:false});
  const shown = mq.matches ? [lines[selected]] : ORDER.map(k=>lines[k]);
  map.fitBounds(L.featureGroup(shown).getBounds(), {padding:[24,24]});
}
new ResizeObserver(fit).observe(document.getElementById('map'));
window.addEventListener('load', fit);
window.addEventListener('resize', fit);
applyMode();
requestAnimationFrame(fit);
setTimeout(fit, 300);
</script>
